name: Desktop Quality Gate

on:
  pull_request:
    paths:
      - 'packages/pos-desktop/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/desktop-quality-gate.yml'
  push:
    branches:
      - main
    paths:
      - 'packages/pos-desktop/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/desktop-quality-gate.yml'

jobs:
  pos-desktop-gate:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Desktop Tests
        run: npm run test --workspace @marketpos/pos-desktop

      - name: Desktop Web Build
        run: npm run build --workspace @marketpos/pos-desktop

      - name: Desktop Electron Build
        run: npm run build:electron --workspace @marketpos/pos-desktop
