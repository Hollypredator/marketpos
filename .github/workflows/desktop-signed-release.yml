name: Desktop Signed Release

on:
  workflow_dispatch:

jobs:
  signed-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Build Signed Desktop Installer
        run: npm run electron:release:signed --workspace @marketpos/pos-desktop
        env:
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_NAME: ${{ secrets.CSC_NAME }}
          CSC_TEAM_NAME: ${{ secrets.CSC_TEAM_NAME }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: marketpos-desktop-signed-release
          path: |
            packages/pos-desktop/release/*.exe
            packages/pos-desktop/release/*.blockmap
            packages/pos-desktop/release/release-manifest.json
