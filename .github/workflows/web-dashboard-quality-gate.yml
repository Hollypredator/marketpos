name: Web Dashboard Quality Gate

on:
  pull_request:
    paths:
      - 'packages/web-dashboard/**'
      - 'packages/shared/**'
      - 'package.json'
      - 'package-lock.json'
      - 'turbo.json'
      - '.github/workflows/web-dashboard-quality-gate.yml'
  push:
    branches:
      - main
    paths:
      - 'packages/web-dashboard/**'
      - 'packages/shared/**'
      - 'package.json'
      - 'package-lock.json'
      - 'turbo.json'
      - '.github/workflows/web-dashboard-quality-gate.yml'

jobs:
  web-dashboard-gate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Shared Typecheck
        run: npm run typecheck --workspace @marketpos/shared

      - name: Web Lint
        run: npm run lint --workspace @marketpos/web-dashboard

      - name: Web Test
        run: npm run test --workspace @marketpos/web-dashboard

      - name: Web Build
        run: npm run build --workspace @marketpos/web-dashboard
