services:
  postgres:
    image: postgres:16-alpine
    container_name: marketpos-postgres
    restart: unless-stopped
    env_file:
      - .env.pilot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "10"

  api:
    build:
      context: ../../..
      dockerfile: packages/api-server/deploy/Dockerfile
    container_name: marketpos-api
    restart: unless-stopped
    env_file:
      - .env.pilot
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "10"

  db-backup:
    image: postgres:16-alpine
    container_name: marketpos-db-backup
    restart: unless-stopped
    env_file:
      - .env.pilot
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backups:/backups
      - ./scripts/backup-loop.sh:/usr/local/bin/backup-loop.sh:ro
    entrypoint: ["sh", "/usr/local/bin/backup-loop.sh"]
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "10"

volumes:
  postgres_data:

